; Fun Fact sticky note: sits on the desktop layer, drag to move, click to open the fact's source.
; Facts come from the daily-facts collection (Wikipedia "Did you know..." facts, each with its source).

[Rainmeter]
Update=1000
AccurateText=1
; let the window grow when a longer fact replaces the placeholder
DynamicWindowSize=1
; -2 = "On Desktop": stays behind all windows and survives Win+D
OnRefreshAction=[!ZPos -2]

[Metadata]
Name=FunFact
Information=Random sourced fact from the daily-facts collection (GitHub Pages), refreshed at fixed times of day.

[Variables]
; where the daily-facts collection is published (GitHub Pages)
BaseURL=https://raditya-rizky.github.io/daily-facts
; times of day (24h, comma separated) to fetch a new fact. If the laptop was off at a fetch time,
; it fetches once when it's next on. The last fact + fetch time are saved in cache.txt, so restarts don't refetch.
FetchTimes=10:00,15:00

; Both downloads stay disabled until FunFact.lua sets their URL and asks for them
; (DynamicVariables on a WebParser keeps restarting the download, so URLs are set from Lua instead).
[MeasureIndex]
Measure=WebParser
URL=#BaseURL#/index.json
CodePage=65001
RegExp=(?s)^(.*)$
StringIndex=1
Disabled=1
UpdateRate=999999
FinishAction=[!CommandMeasure MeasureScript "GotIndex()"]

[MeasureMonth]
Measure=WebParser
URL=#BaseURL#/index.json
CodePage=65001
RegExp=(?s)^(.*)$
StringIndex=1
Disabled=1
UpdateRate=999999
FinishAction=[!CommandMeasure MeasureScript "GotMonth()"]

[MeasureScript]
Measure=Script
ScriptFile=#CURRENTPATH#FunFact.lua
; checks once a minute whether a fetch time has passed since the last fact
UpdateDivider=60

[MeterBg]
Meter=Shape
; height follows the fact + source text, so the card grows with long facts
; clicking anywhere on the card opens the source (set by FunFact.lua); a drag does not count as a click
Shape=Rectangle 0,0,280,([MeterSource:Y]+[MeterSource:H]+14),10 | Fill Color 18,18,24,200 | StrokeWidth 1 | Stroke Color 255,255,255,45
DynamicVariables=1

[MeterHeader]
Meter=String
Text=DID YOU KNOW?
X=16
Y=14
FontFace=Segoe UI
FontWeight=700
FontSize=9
FontColor=255,204,77
AntiAlias=1

[MeterLine]
Meter=Shape
Shape=Line 16,1,264,1 | StrokeWidth 1 | Stroke Color 255,255,255,50
Y=6R

[MeterFact]
Meter=String
; text is set by FunFact.lua (from cache on start, from the collection when due)
Text=Fetching a fun fact...
X=16
Y=8R
W=248
ClipString=2
FontFace=Segoe UI
FontSize=11
FontColor=255,255,255,235
AntiAlias=1
ToolTipText=Drag to move. Click to open the source.

[MeterSource]
Meter=String
Text=
X=16
Y=6R
W=248
ClipString=2
FontFace=Segoe UI
FontSize=8
FontColor=255,255,255,140
AntiAlias=1
