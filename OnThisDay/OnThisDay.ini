; On This Day note: a random event from Wikipedia's "On this day" for today's date, new one every 2 hours.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
; -2 = "On Desktop": stays behind all windows and survives Win+D
OnRefreshAction=[!ZPos -2]

[Metadata]
Name=OnThisDay
Information=Random event from Wikipedia's "On this day" (selected anniversaries), refreshed every 2 hours.

[MeasureDate]
Measure=Time
Format=%m/%d

[MeasureTimer]
; fires on the first update and every 2 hours after: puts today's date in the URL, then downloads.
; (DynamicVariables on the WebParser itself keeps restarting the download, so the URL is set here instead.)
Measure=Calc
; own counter (Rainmeter's Counter keeps running across skin refreshes): 1 on the first update, then every 7200s
Formula=(MeasureTimer + 1) % 7200
IfCondition=MeasureTimer = 1
IfTrueAction=[!SetOption MeasureFeed URL "https://en.wikipedia.org/api/rest_v1/feed/onthisday/selected/[MeasureDate]"][!EnableMeasure MeasureFeed][!CommandMeasure MeasureFeed "Update"]
DynamicVariables=1

[MeasureFeed]
Measure=WebParser
; real URL is set by MeasureTimer; disabled until then so nothing downloads with a wrong date
URL=https://en.wikipedia.org/api/rest_v1/feed/onthisday/selected/
Disabled=1
UserAgent=RainmeterOnThisDayNote/1.0 (personal desktop widget)
CodePage=65001
RegExp=(?s)^(.*)$
StringIndex=1
; downloads are driven by MeasureTimer, so never refetch on its own
UpdateRate=999999
FinishAction=[!UpdateMeasure MeasureScript]

[MeasureScript]
Measure=Script
ScriptFile=#CURRENTPATH#OnThisDay.lua
; only runs when the feed finishes downloading
UpdateDivider=-1

[MeterBg]
Meter=Shape
; height follows the event text, so the card grows with long entries
Shape=Rectangle 0,0,280,([MeterFact:Y]+[MeterFact:H]+16),10 | Fill Color 18,18,24,200 | StrokeWidth 1 | Stroke Color 255,255,255,45
DynamicVariables=1

[MeterHeader]
Meter=String
Text=ON THIS DAY
X=16
Y=14
FontFace=Segoe UI
FontWeight=700
FontSize=9
FontColor=255,204,77
AntiAlias=1

[MeterLine]
Meter=Shape
Shape=Line 16,1,264,1 | StrokeWidth 1 | Stroke Color 255,255,255,50
Y=6R

[MeterFact]
Meter=String
Text=Loading today's history...
X=16
Y=8R
W=248
ClipString=2
FontFace=Segoe UI
FontSize=11
FontColor=255,255,255,235
AntiAlias=1
ToolTipText=From Wikipedia's "On this day". Drag to move. Right-click > Refresh skin for another event.
